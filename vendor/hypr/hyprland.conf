# Hyprland — custom project
# Install: ./install_hypr.sh

source = ~/.config/hypr/current_theme.conf
source = ~/.config/hypr/windows-rule.conf
source = ~/.config/hypr/binds.conf

################
### MONITORS ###
################

monitor=,preferred,auto,1

#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = sh -c 'test -x /usr/lib/xfce-polkit/xfce-polkit && /usr/lib/xfce-polkit/xfce-polkit || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1'
exec-once = numlockx on
exec-once = nm-applet --indicator
exec-once = hyprsunset -c ~/.config/hypr/hyprsunset.conf
exec-once = hypridle -c ~/.config/hypr/hypridle.conf
exec-once = ~/.config/hypr/scripts/gtkthemes
exec-once = wl-paste --type text --watch cliphist -max-items 2000 store
exec-once = wl-paste --type image --watch cliphist -max-items 2000 store
exec-once = ~/.config/custom/waybar-current.sh
exec-once = awww-daemon
exec-once = mako -c ~/.config/themes/mako/config

exec-once = wayvnc -C ~/.config/wayvnc/config

# -- Apps -- #
# Workspace 1
exec-once = [workspace 1 silent] foot -c ~/.config/custom/foot/foot.ini
# Workspace 2
exec-once = [workspace 2 silent] firefox
# Workspace 8
exec-once = [workspace 8 silent] brave-origin-nightly http://127.0.0.1:8080/all-split.html
# Workspace 9
exec-once = [workspace 9 silent] blueman-manager
exec-once = [workspace 9 silent] gmetronome

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Qogir-cursors
env = HYPRCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = GSK_RENDERER,cairo
env = WEBKIT_DISABLE_DMABUFF,1

####################
### LOOK AND FEEL ###
####################

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
}

dwindle {
    preserve_split = false
}

master {
    new_status = master
}

decoration {
    rounding = 6
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, default
    animation = windowsIn, 1, 4.1, default, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

#############
### INPUT ###
#############

input {
    kb_layout = br
    kb_variant = abnt2
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace
